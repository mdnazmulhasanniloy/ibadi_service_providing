# ===== APP DEPLOYMENT =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iumi-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iumi-app
  template:
    metadata:
      labels:
        app: iumi-app
    spec:
      containers:
        - name: app
          image: nazmulhasn/iumi_app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
            - containerPort: 5005
          env:
            - name: DATABASE_URL
              value: "mongodb+srv://car-doctor:car-doctor@cluster0.pyj8wdj.mongodb.net/iumi_app?retryWrites=true&w=majority"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: iumi-app-service
spec:
  selector:
    app: iumi-app
  ports:
    - name: api
      protocol: TCP
      port: 5000
      targetPort: 5000
    - name: socket
      protocol: TCP
      port: 5005
      targetPort: 5005
  type: ClusterIP

---
# ===== REDIS =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP

---
# ===== SSL ISSUER =====
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: badeaiulianalexandru1994@gmail.com     # ← আপনার email দিন
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx

---
# ===== INGRESS =====
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iumi-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - api.iumi.ro
        - socket.iumi.ro
      secretName: iumi-tls
  rules:
    - host: api.iumi.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iumi-app-service
                port:
                  number: 5000
    - host: socket.iumi.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iumi-app-service
                port:
                  number: 5005