<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Support Message</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f4f7;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
      }
      .wrapper {
        width: 100%;
        padding: 32px 0;
        background-color: #f4f4f7;
      }
      .container {
        max-width: 560px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
      }
      .header {
        background-color: #111827;
        padding: 24px 32px;
      }
      .header h1 {
        color: #ffffff;
        font-size: 18px;
        margin: 0;
        font-weight: 600;
      }
      .body {
        padding: 32px;
      }
      .label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #6b7280;
        margin-bottom: 4px;
      }
      .value {
        font-size: 15px;
        color: #111827;
        margin-bottom: 20px;
        line-height: 1.5;
      }
      .message-box {
        background-color: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 16px;
        font-size: 14px;
        color: #374151;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .footer {
        padding: 20px 32px;
        background-color: #f9fafb;
        border-top: 1px solid #e5e7eb;
      }
      .footer p {
        font-size: 12px;
        color: #9ca3af;
        margin: 0;
        text-align: center;
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #111827;
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="header">
          <h1>New Support Message</h1>
        </div>
        <div class="body">
          <div class="label">From</div>
          <div class="value">{{name}} &lt;{{email}}&gt;</div>

          <div class="label">Subject</div>
          <div class="value">{{subject}}</div>

          <div class="label">Message</div>
          <div class="message-box">{{message}}</div>

          <a href="mailto:{{email}}?subject=Re: {{subject}}" class="btn"
            >Reply to {{name}}</a
          >
        </div>
        <div class="footer">
          <p>Received on {{createdAt}}</p>
        </div>
      </div>
    </div>
  </body>
</html>
